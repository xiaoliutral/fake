<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fake EventBus Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--border); background: #121a24;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .02em; }
    header .meta { color: var(--muted); font-size: 12px; }
    nav { display: flex; gap: 4px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    nav button {
      background: transparent; border: 1px solid transparent; color: var(--muted);
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    nav button.active, nav button:hover {
      color: var(--text); background: var(--panel); border-color: var(--border);
    }
    main { padding: 16px 20px 40px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px;
    }
    .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .card .value { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
    .chart-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
      height: 260px;
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
    input, select, button.action {
      background: #0d131c; border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 7px 10px; font-size: 13px;
    }
    button.action { cursor: pointer; background: var(--accent); border-color: transparent; }
    button.action.secondary { background: transparent; border-color: var(--border); }
    button.action.danger { background: var(--danger); }
    button.action:disabled { opacity: .5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 500; background: #121a24; position: sticky; top: 0; }
    .table-wrap {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      overflow: auto; max-height: 560px;
    }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
      background: #243044; color: var(--muted);
    }
    .badge.ok { background: rgba(34,197,94,.15); color: var(--ok); }
    .badge.warn { background: rgba(245,158,11,.15); color: var(--warn); }
    .badge.danger { background: rgba(239,68,68,.15); color: var(--danger); }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    .pager { display: flex; gap: 8px; align-items: center; margin-top: 10px; color: var(--muted); font-size: 12px; }
    pre.payload {
      margin: 0; white-space: pre-wrap; word-break: break-word;
      color: #c8d4e6; font-size: 12px; font-family: ui-monospace, Consolas, monospace;
      background: #0d131c; border: 1px solid var(--border); border-radius: 8px; padding: 12px;
      max-height: 50vh; overflow: auto;
    }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: rgba(59,130,246,.08); }
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40;
      display: flex; justify-content: flex-end;
    }
    .drawer {
      width: min(560px, 100vw); height: 100%; background: #121a24;
      border-left: 1px solid var(--border); padding: 16px 18px; overflow: auto;
      box-shadow: -12px 0 40px rgba(0,0,0,.35);
    }
    .drawer h2 { margin: 0 0 4px; font-size: 16px; }
    .drawer .row { margin: 10px 0; font-size: 13px; }
    .drawer .row .k { color: var(--muted); display: block; margin-bottom: 2px; font-size: 11px; }
    .drawer-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .toast {
      position: fixed; right: 16px; bottom: 16px; z-index: 60;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; font-size: 13px; max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .toast.ok { border-color: rgba(34,197,94,.4); }
    .toast.err { border-color: rgba(239,68,68,.5); }
    .handler-list { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
    .handler-list li { margin: 2px 0; word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <h1>Fake EventBus Dashboard</h1>
    <div class="meta" id="serverMeta">connecting…</div>
  </header>
  <nav>
    <button class="active" data-tab="overview">Overview</button>
    <button data-tab="subscriptions">Events / Consumers</button>
    <button data-tab="outbox">Published / Outbox</button>
    <button data-tab="inbox">Received / Inbox</button>
    <button data-tab="dlx">DLX</button>
  </nav>
  <main>
    <section id="tab-overview">
      <div class="cards" id="metricCards"></div>
      <div class="charts">
        <div class="chart-box"><canvas id="chartOutbox"></canvas></div>
        <div class="chart-box"><canvas id="chartInbox"></canvas></div>
      </div>
      <div class="cards" id="stateCards"></div>
    </section>

    <section id="tab-subscriptions" class="hidden">
      <div class="toolbar">
        <button class="action secondary" id="subsRefresh">Refresh</button>
        <span class="muted" id="subsMeta"></span>
      </div>
      <div class="table-wrap"><table><thead>
        <tr><th>Event</th><th>Routing Key</th><th>Handlers</th></tr>
      </thead><tbody id="subsBody"></tbody></table></div>
    </section>

    <section id="tab-outbox" class="hidden">
      <div class="toolbar">
        <select id="outboxState">
          <option value="">All states</option>
          <option>NotPublished</option>
          <option>InProgress</option>
          <option>Published</option>
          <option>PublishFailed</option>
        </select>
        <input id="outboxType" placeholder="Event type" />
        <input id="outboxKeyword" placeholder="Keyword / Id" />
        <button class="action" id="outboxSearch">Search</button>
      </div>
      <div class="table-wrap"><table><thead>
        <tr><th>EventId</th><th>Type</th><th>State</th><th>Times</th><th>Created</th><th>Actions</th></tr>
      </thead><tbody id="outboxBody"></tbody></table></div>
      <div class="pager" id="outboxPager"></div>
    </section>

    <section id="tab-inbox" class="hidden">
      <div class="toolbar">
        <select id="inboxState">
          <option value="">All states</option>
          <option>Consuming</option>
          <option>ConsumeSucceeded</option>
          <option>ConsumeFailed</option>
        </select>
        <input id="inboxType" placeholder="Event type" />
        <input id="inboxKeyword" placeholder="Keyword / Id" />
        <button class="action" id="inboxSearch">Search</button>
      </div>
      <div class="table-wrap"><table><thead>
        <tr><th>EventId</th><th>Type</th><th>State</th><th>Processed</th><th>Error</th><th>Actions</th></tr>
      </thead><tbody id="inboxBody"></tbody></table></div>
      <div class="pager" id="inboxPager"></div>
    </section>

    <section id="tab-dlx" class="hidden">
      <div class="toolbar">
        <button class="action" id="dlxRefresh">Refresh DLX</button>
        <span class="muted" id="dlxStatus"></span>
      </div>
      <div class="table-wrap"><table><thead>
        <tr><th>MessageId</th><th>RoutingKey</th><th>EventId</th><th>Reason</th><th>Body</th><th>Actions</th></tr>
      </thead><tbody id="dlxBody"></tbody></table></div>
    </section>
  </main>

  <div id="drawerRoot" class="drawer-backdrop hidden" onclick="if(event.target===this)closeDrawer()">
    <aside class="drawer" id="drawer">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <h2 id="drawerTitle">Message</h2>
        <button class="action secondary" onclick="closeDrawer()">Close</button>
      </div>
      <div id="drawerMeta"></div>
      <div class="drawer-actions" id="drawerActions"></div>
      <div class="row"><span class="k">Payload</span>
        <div class="drawer-actions" style="margin-top:0;">
          <button class="action secondary" id="btnCopyJson">Copy JSON</button>
          <button class="action secondary" id="btnCopyRaw">Copy raw</button>
        </div>
        <pre class="payload" id="drawerPayload">loading…</pre>
      </div>
    </aside>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script>
    const API = "{{API_BASE}}";
    const POLL_MS = Number("{{POLL_MS}}") || 2000;

    const stateBadge = (s) => {
      if (!s) return "";
      const cls = /Failed|fail/i.test(s) ? "danger"
        : /Published|Succeeded/i.test(s) ? "ok"
        : /Progress|Consuming|NotPublished/i.test(s) ? "warn" : "";
      return `<span class="badge ${cls}">${s}</span>`;
    };

    const fmt = (n) => Number(n || 0).toLocaleString();
    const shortId = (id) => {
      const s = (id || "").toString();
      return s.length > 10 ? s.slice(0, 8) + "…" : s;
    };
    const esc = (s) => String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    let outboxPage = 1, inboxPage = 1;
    let drawerItem = null;
    let drawerKind = null; // outbox | inbox | dlx
    const dlxCache = new Map();
    const history = { labels: [], enqueued: [], dispatched: [], failed: [], inboxOk: [], inboxDup: [], inboxFail: [] };
    const MAX_POINTS = 30;

    const chartOutbox = new Chart(document.getElementById("chartOutbox"), {
      type: "line",
      data: {
        labels: history.labels,
        datasets: [
          { label: "Enqueued", data: history.enqueued, borderColor: "#3b82f6", tension: .25, pointRadius: 0 },
          { label: "Dispatched", data: history.dispatched, borderColor: "#22c55e", tension: .25, pointRadius: 0 },
          { label: "Failed", data: history.failed, borderColor: "#ef4444", tension: .25, pointRadius: 0 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: "#8b9bb4" } } },
        scales: { x: { ticks: { color: "#8b9bb4" } }, y: { ticks: { color: "#8b9bb4" }, beginAtZero: true } } }
    });

    const chartInbox = new Chart(document.getElementById("chartInbox"), {
      type: "line",
      data: {
        labels: history.labels,
        datasets: [
          { label: "Processed", data: history.inboxOk, borderColor: "#22c55e", tension: .25, pointRadius: 0 },
          { label: "Duplicate", data: history.inboxDup, borderColor: "#f59e0b", tension: .25, pointRadius: 0 },
          { label: "Failed", data: history.inboxFail, borderColor: "#ef4444", tension: .25, pointRadius: 0 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: "#8b9bb4" } } },
        scales: { x: { ticks: { color: "#8b9bb4" } }, y: { ticks: { color: "#8b9bb4" }, beginAtZero: true } } }
    });

    document.querySelectorAll("nav button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        ["overview","subscriptions","outbox","inbox","dlx"].forEach(t => {
          document.getElementById("tab-" + t).classList.toggle("hidden", t !== btn.dataset.tab);
        });
        if (btn.dataset.tab === "subscriptions") loadSubscriptions();
        if (btn.dataset.tab === "outbox") loadOutbox();
        if (btn.dataset.tab === "inbox") loadInbox();
        if (btn.dataset.tab === "dlx") loadDlx();
      });
    });

    async function api(path, opts) {
      const res = await fetch(API + path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {}));
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!res.ok) {
        const msg = (data && data.error) || (typeof data === "string" ? data : text) || res.statusText;
        throw new Error(msg);
      }
      return data;
    }

    function toast(msg, ok) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast " + (ok ? "ok" : "err");
      el.classList.remove("hidden");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add("hidden"), 4200);
    }

    function prettyJson(raw) {
      if (raw == null || raw === "") return "";
      try { return JSON.stringify(JSON.parse(raw), null, 2); } catch { return String(raw); }
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text || "");
        toast("Copied", true);
      } catch {
        toast("Copy failed", false);
      }
    }

    function renderCards(m) {
      const cards = [
        ["Outbox Enqueued", m.outboxEnqueued],
        ["Dispatched (immediate)", m.outboxDispatchedImmediate],
        ["Dispatched (scan)", m.outboxDispatchedScan],
        ["Dispatch Failed", m.outboxDispatchFailed],
        ["Scan Retry", m.outboxScanRetry],
        ["Inbox Processed", m.inboxProcessed],
        ["Inbox Duplicate", m.inboxDuplicate],
        ["Inbox Failed", m.inboxFailed]
      ];
      document.getElementById("metricCards").innerHTML = cards.map(([l,v]) =>
        `<div class="card"><div class="label">${l}</div><div class="value">${fmt(v)}</div></div>`).join("");
    }

    function renderStateCards(outbox, inbox) {
      const parts = [];
      (outbox || []).forEach(x => parts.push(`<div class="card"><div class="label">Outbox · ${x.state}</div><div class="value">${fmt(x.count)}</div></div>`));
      (inbox || []).forEach(x => parts.push(`<div class="card"><div class="label">Inbox · ${x.state}</div><div class="value">${fmt(x.count)}</div></div>`));
      document.getElementById("stateCards").innerHTML = parts.join("") || `<div class="muted">No persisted messages yet.</div>`;
    }

    function pushHistory(m) {
      const label = new Date().toLocaleTimeString();
      history.labels.push(label);
      history.enqueued.push(m.outboxEnqueued);
      history.dispatched.push((m.outboxDispatchedImmediate || 0) + (m.outboxDispatchedScan || 0));
      history.failed.push(m.outboxDispatchFailed);
      history.inboxOk.push(m.inboxProcessed);
      history.inboxDup.push(m.inboxDuplicate);
      history.inboxFail.push(m.inboxFailed);
      if (history.labels.length > MAX_POINTS) {
        Object.keys(history).forEach(k => history[k].shift());
      }
      chartOutbox.update("none");
      chartInbox.update("none");
    }

    async function refreshStats() {
      try {
        const data = await api("/stats");
        renderCards(data.metrics);
        renderStateCards(data.outbox, data.inbox);
        pushHistory(data.metrics);
        document.getElementById("serverMeta").textContent =
          `UTC ${new Date(data.serverTimeUtc).toISOString()} · poll ${data.pollIntervalMs}ms · DLX ${data.dlxAvailable ? "on" : "off"}`;
      } catch (e) {
        document.getElementById("serverMeta").textContent = "error: " + e.message;
      }
    }

    async function loadSubscriptions() {
      const data = await api("/subscriptions");
      const items = data.items || [];
      document.getElementById("subsMeta").textContent = `${items.length} event type(s)`;
      document.getElementById("subsBody").innerHTML = items.map(item => `
        <tr>
          <td>
            <div>${esc(item.eventTypeShortName)}</div>
            <div class="mono muted">${esc(item.eventTypeName)}</div>
          </td>
          <td class="mono">${esc(item.routingKey)}</td>
          <td>
            ${(item.handlers || []).length
              ? `<ul class="handler-list">${item.handlers.map(h => `<li class="mono">${esc(h)}</li>`).join("")}</ul>`
              : `<span class="muted">No handlers registered</span>`}
          </td>
        </tr>`).join("") || `<tr><td colspan="3" class="muted">No subscriptions (is RabbitMQ EventBus loaded?)</td></tr>`;
    }

    async function loadOutbox() {
      const q = new URLSearchParams({
        pageIndex: outboxPage, pageSize: 20,
        state: document.getElementById("outboxState").value,
        eventType: document.getElementById("outboxType").value,
        keyword: document.getElementById("outboxKeyword").value
      });
      const data = await api("/outbox?" + q.toString());
      document.getElementById("outboxBody").innerHTML = (data.items || []).map(item => `
        <tr class="clickable" onclick="openOutbox('${item.eventId}')">
          <td class="mono" title="${esc(item.eventId)}">${shortId(item.eventId)}</td>
          <td>${esc(item.eventTypeShortName)}</td>
          <td>${stateBadge(item.state)}</td>
          <td>${item.timesSent}</td>
          <td class="mono">${esc(item.creationTime)}</td>
          <td onclick="event.stopPropagation()">
            <button class="action" onclick="retryOutbox('${item.eventId}', true)">Retry &amp; publish</button>
            <button class="action secondary" onclick="retryOutbox('${item.eventId}', false)">Reset only</button>
            <button class="action secondary" onclick="openOutbox('${item.eventId}')">Preview</button>
          </td>
        </tr>`).join("") || `<tr><td colspan="6" class="muted">No data</td></tr>`;
      document.getElementById("outboxPager").innerHTML =
        `Total ${data.total} · Page ${data.pageIndex}
         <button class="action secondary" onclick="outboxPage=Math.max(1,outboxPage-1);loadOutbox()">Prev</button>
         <button class="action secondary" onclick="outboxPage=outboxPage+1;loadOutbox()">Next</button>`;
    }

    async function loadInbox() {
      const q = new URLSearchParams({
        pageIndex: inboxPage, pageSize: 20,
        state: document.getElementById("inboxState").value,
        eventType: document.getElementById("inboxType").value,
        keyword: document.getElementById("inboxKeyword").value
      });
      const data = await api("/inbox?" + q.toString());
      document.getElementById("inboxBody").innerHTML = (data.items || []).map(item => `
        <tr class="clickable" onclick="openInbox('${item.eventId}')">
          <td class="mono" title="${esc(item.eventId)}">${shortId(item.eventId)}</td>
          <td>${esc(item.eventTypeShortName)}</td>
          <td>${stateBadge(item.state)}</td>
          <td class="mono">${esc(item.processedTime)}</td>
          <td>${esc(item.errorMessage || "")}</td>
          <td onclick="event.stopPropagation()">
            <button class="action" onclick="retryInbox('${item.eventId}', true)">Reprocess</button>
            <button class="action secondary" onclick="retryInbox('${item.eventId}', false)">Reset only</button>
            <button class="action secondary" onclick="openInbox('${item.eventId}')">Preview</button>
          </td>
        </tr>`).join("") || `<tr><td colspan="6" class="muted">No data</td></tr>`;
      document.getElementById("inboxPager").innerHTML =
        `Total ${data.total} · Page ${data.pageIndex}
         <button class="action secondary" onclick="inboxPage=Math.max(1,inboxPage-1);loadInbox()">Prev</button>
         <button class="action secondary" onclick="inboxPage=inboxPage+1;loadInbox()">Next</button>`;
    }

    async function loadDlx() {
      try {
        const data = await api("/dlx/messages?maxCount=50");
        document.getElementById("dlxStatus").textContent = data.available
          ? `${(data.items||[]).length} message(s) previewed (held until requeue/discard/refresh)`
          : "DLX not available (enable RabbitMQ EventBus EnableDlx)";
        dlxCache.clear();
        (data.items || []).forEach(item => dlxCache.set(item.messageId, item));
        document.getElementById("dlxBody").innerHTML = (data.items || []).map(item => `
          <tr class="clickable" onclick="openDlxById('${esc(item.messageId)}')">
            <td class="mono">${shortId(item.messageId)}</td>
            <td class="mono">${esc(item.routingKey || "")}</td>
            <td class="mono">${esc(item.eventId || "")}</td>
            <td>${esc(item.deathReason || "")}</td>
            <td class="mono muted">${esc((item.body || "").slice(0, 80))}</td>
            <td onclick="event.stopPropagation()">
              <button class="action" onclick="dlxOp('${esc(item.messageId)}','requeue')">Requeue</button>
              <button class="action danger" onclick="dlxOp('${esc(item.messageId)}','discard')">Discard</button>
              <button class="action secondary" onclick="openDlxById('${esc(item.messageId)}')">Preview</button>
            </td>
          </tr>`).join("") || `<tr><td colspan="6" class="muted">Empty</td></tr>`;
      } catch (e) {
        document.getElementById("dlxStatus").textContent = e.message;
      }
    }

    function openDrawer(kind, item, title) {
      drawerKind = kind;
      drawerItem = item;
      document.getElementById("drawerTitle").textContent = title;
      document.getElementById("drawerRoot").classList.remove("hidden");
      const meta = document.getElementById("drawerMeta");
      const actions = document.getElementById("drawerActions");
      const payload = item.content || item.body || "";
      document.getElementById("drawerPayload").textContent = prettyJson(payload) || "(empty)";

      if (kind === "outbox") {
        meta.innerHTML = `
          <div class="row"><span class="k">EventId</span><span class="mono">${esc(item.eventId)}</span></div>
          <div class="row"><span class="k">Type</span>${esc(item.eventTypeName)} ${stateBadge(item.state)}</div>
          <div class="row"><span class="k">TimesSent / Tx</span>${item.timesSent} · <span class="mono">${esc(item.transactionId)}</span></div>
          <div class="row"><span class="k">Created</span><span class="mono">${esc(item.creationTime)}</span></div>`;
        actions.innerHTML = `
          <button class="action" onclick="retryOutbox('${item.eventId}', true)">Retry &amp; publish</button>
          <button class="action secondary" onclick="retryOutbox('${item.eventId}', false)">Reset only</button>`;
      } else if (kind === "inbox") {
        meta.innerHTML = `
          <div class="row"><span class="k">EventId</span><span class="mono">${esc(item.eventId)}</span></div>
          <div class="row"><span class="k">Type</span>${esc(item.eventTypeName)} ${stateBadge(item.state)}</div>
          <div class="row"><span class="k">Processed</span><span class="mono">${esc(item.processedTime)}</span></div>
          <div class="row"><span class="k">Error</span>${esc(item.errorMessage || "-")}</div>`;
        actions.innerHTML = `
          <button class="action" onclick="retryInbox('${item.eventId}', true)">Reprocess handlers</button>
          <button class="action secondary" onclick="retryInbox('${item.eventId}', false)">Reset only</button>`;
      } else {
        meta.innerHTML = `
          <div class="row"><span class="k">MessageId</span><span class="mono">${esc(item.messageId)}</span></div>
          <div class="row"><span class="k">RoutingKey</span><span class="mono">${esc(item.routingKey || "")}</span></div>
          <div class="row"><span class="k">EventId</span><span class="mono">${esc(item.eventId || "")}</span></div>
          <div class="row"><span class="k">Reason</span>${esc(item.deathReason || "-")}</div>`;
        actions.innerHTML = `
          <button class="action" onclick="dlxOp('${esc(item.messageId)}','requeue')">Requeue</button>
          <button class="action danger" onclick="dlxOp('${esc(item.messageId)}','discard')">Discard</button>`;
      }
    }

    function closeDrawer() {
      document.getElementById("drawerRoot").classList.add("hidden");
      drawerItem = null;
      drawerKind = null;
    }

    window.openOutbox = async (id) => {
      const item = await api(`/outbox/${id}`);
      openDrawer("outbox", item, "Outbox message");
    };
    window.openInbox = async (id) => {
      const item = await api(`/inbox/${id}`);
      openDrawer("inbox", item, "Inbox message");
    };
    window.openDlxById = (id) => {
      const item = dlxCache.get(id);
      if (!item) { toast("Message no longer in preview buffer — refresh DLX", false); return; }
      openDrawer("dlx", item, "DLX message");
    };

    window.retryOutbox = async (id, publishNow) => {
      try {
        const data = await api(`/outbox/${id}/retry`, {
          method: "POST",
          body: JSON.stringify({ publishNow, clearInbox: true })
        });
        if (publishNow && !data.published) {
          toast(data.error || "Publish did not complete", false);
        } else {
          toast(publishNow
            ? `Published${data.inboxCleared ? " (inbox cleared)" : ""}`
            : "Reset to NotPublished", true);
        }
        await loadOutbox(); await refreshStats();
        if (drawerKind === "outbox" && drawerItem && drawerItem.eventId === id) await openOutbox(id);
      } catch (e) { toast(e.message, false); }
    };

    window.retryInbox = async (id, reprocessNow) => {
      try {
        const data = await api(`/inbox/${id}/retry`, {
          method: "POST",
          body: JSON.stringify({ reprocessNow })
        });
        if (reprocessNow && !data.processed) {
          toast(data.error || "Reprocess failed", false);
        } else {
          toast(reprocessNow ? "Handlers reprocessed" : "Inbox reset for reclaim", true);
        }
        await loadInbox(); await refreshStats();
        if (drawerKind === "inbox" && drawerItem && drawerItem.eventId === id) await openInbox(id);
      } catch (e) { toast(e.message, false); }
    };

    window.dlxOp = async (id, op) => {
      try {
        await api(`/dlx/messages/${id}/${op}`, { method: "POST", body: "{}" });
        toast(op === "requeue" ? "Requeued" : "Discarded", true);
        await loadDlx();
        if (op === "discard") closeDrawer();
      } catch (e) { toast(e.message, false); }
    };

    document.getElementById("btnCopyJson").onclick = () => {
      const raw = drawerItem && (drawerItem.content || drawerItem.body || "");
      copyText(prettyJson(raw) || "");
    };
    document.getElementById("btnCopyRaw").onclick = () => {
      const raw = drawerItem && (drawerItem.content || drawerItem.body || "");
      copyText(raw || "");
    };

    document.getElementById("outboxSearch").onclick = () => { outboxPage = 1; loadOutbox(); };
    document.getElementById("inboxSearch").onclick = () => { inboxPage = 1; loadInbox(); };
    document.getElementById("dlxRefresh").onclick = () => loadDlx();
    document.getElementById("subsRefresh").onclick = () => loadSubscriptions();

    refreshStats();
    setInterval(refreshStats, POLL_MS);
  </script>
</body>
</html>
